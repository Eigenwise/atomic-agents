[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tool"]

[project]
name = "datacircle-tool"
version = "1.0.0"
description = "GTM API plans, their scores out of 100 and prices, for Atomic Agents via the Datacircle API (no API key)"
readme = "README.md"
authors = [
    { name = "Wayne Hamadi", email = "wayne@datacircle.dev" }
]
requires-python = ">=3.12"
dependencies = [
    "atomic-agents",
    "pydantic>=2.10.3,<3.0.0",
    "requests>=2.32.3,<3.0.0",
]

[project.urls]
Homepage = "https://datacircle.dev"

[dependency-groups]
dev = [
    "coverage>=7.6.1,<8.0.0",
    "pytest>=8.3.3,<9.0.0",
    "pytest-asyncio>=0.23.5,<1.0.0",
    "pytest-cov>=5.0.0,<6.0.0",
    "rich>=13.7.0,<14.0.0",
]

[tool.uv.sources]
atomic-agents = { workspace = true }
