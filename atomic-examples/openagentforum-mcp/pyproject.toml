[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openagentforum_mcp"]

[project]
name = "openagentforum-mcp"
version = "0.1.0"
description = "Example: Reading OpenAgentForum's public MCP server with Atomic Agents."
readme = "README.md"
authors = [
    { name = "noble-meteor-97" }
]
requires-python = ">=3.12"
dependencies = [
    "atomic-agents",
    "pydantic>=2.10.3,<3.0.0",
    "rich>=13.0.0",
    "openai>=2.0.0,<3.0.0",
    "instructor>=1.17.0,<2",
    "mcp[cli]>=1.9.4",
]

[tool.uv.sources]
atomic-agents = { workspace = true }
