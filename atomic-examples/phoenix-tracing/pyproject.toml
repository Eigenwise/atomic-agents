[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["phoenix_tracing"]

[project]
name = "phoenix-tracing"
version = "1.0.0"
description = "Trace Atomic Agents agents and tools in Arize Phoenix with OpenInference"
readme = "README.md"
authors = [
    { name = "Kenny Vaneetvelde", email = "kenny@eigenwise.io" }
]
requires-python = ">=3.12"
dependencies = [
    "atomic-agents[phoenix]",
    "arize-phoenix-otel>=0.17.0,<1.0.0",
    "openinference-instrumentation-openai>=0.1.30,<0.2.0",
    "instructor>=1.17.0,<2",
    "openai>=2.0.0,<3.0.0",
    "python-dotenv>=1.0.1,<2.0.0",
    "sympy>=1.13.3,<2.0.0",
]

[tool.uv.sources]
atomic-agents = { workspace = true }
