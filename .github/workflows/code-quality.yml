name: Code Quality & Tests

on:
  push:
    branches: [ main, v2.0 ]
  pull_request:
    branches: [ main, v2.0 ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Cache uv
        uses: actions/cache@v4
        id: cache
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-python-${{ runner.python-version }}-${{ hashFiles('**/uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-python-${{ runner.python-version }}-

      - name: Install Dependencies
        run: |
          uv sync
          uv run pip list  # Verify installation

      - name: Verify Black Installation
        run: |
          uv run which black || echo "Black not found"
          uv run black --version

      - name: Run Black Check
        run: |
          uv run black --check atomic-agents atomic-assembler atomic-examples atomic-forge
        if: success()

      - name: Run Flake8
        run: uv run flake8 --extend-exclude=.venv atomic-agents atomic-assembler atomic-examples atomic-forge
        if: success()

      - name: Check AgentConfig constructor typing
        run: uvx --from pyright==1.1.414 pyright atomic-agents/tests/agents/test_config_defaults_typing.py

      - name: Run Tests
        run: uv run pytest --cov=atomic_agents atomic-agents
        if: success()

  fresh-install:
    name: Fresh install imports every subpackage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Build wheel
        run: uv build --wheel --out-dir dist

      - name: Install the wheel into a clean environment without the lockfile
        run: |
          uv venv fresh-install-venv
          uv pip install --python fresh-install-venv "atomic-agents[observability] @ $(ls dist/*.whl)"
          uv pip install --python fresh-install-venv opentelemetry-sdk

      - name: Verify OpenInference is absent
        run: |
          if fresh-install-venv/bin/python -c "import openinference"; then
            echo "OpenInference must not be installed in the api-only environment"
            exit 1
          fi

      - name: Trace a tool and agent with only OpenTelemetry
        run: |
          fresh-install-venv/bin/python - <<'PY'
          import httpx
          import instructor
          import openai
          from opentelemetry.sdk.trace import TracerProvider
          from opentelemetry.sdk.trace.export import SimpleSpanProcessor
          from opentelemetry.sdk.trace.export.in_memory_span_exporter import InMemorySpanExporter

          from atomic_agents import AgentConfig, AtomicAgent, BaseIOSchema, BaseTool
          from atomic_agents.observability import AtomicAgentsInstrumentor, TracingConfig, using_conversation

          exporter = InMemorySpanExporter()
          provider = TracerProvider()
          provider.add_span_processor(SimpleSpanProcessor(exporter))
          AtomicAgentsInstrumentor().instrument(tracer_provider=provider, config=TracingConfig(hide_inputs=True))

          class SmokeInput(BaseIOSchema):
              """Text for the fresh-install tracing check."""

              text: str

          class SmokeOutput(BaseIOSchema):
              """Result of the fresh-install tracing check."""

              text: str

          class SmokeTool(BaseTool[SmokeInput, SmokeOutput]):
              def run(self, params: SmokeInput) -> SmokeOutput:
                  return SmokeOutput(text=params.text)

          def respond(request: httpx.Request) -> httpx.Response:
              assert request.url.path == "/v1/chat/completions"
              return httpx.Response(200, json={
                  "id": "chatcmpl_smoke", "object": "chat.completion", "created": 1,
                  "model": "response-model",
                  "choices": [{"index": 0, "finish_reason": "tool_calls", "message": {
                      "role": "assistant", "content": None, "tool_calls": [{
                          "id": "call_smoke", "type": "function", "function": {
                              "name": "SmokeOutput", "arguments": '{"text": "offline response"}'
                          }
                      }]
                  }}],
                  "usage": {
                      "prompt_tokens": 3, "completion_tokens": 2, "total_tokens": 5,
                      "prompt_tokens_details": {"cached_tokens": 1},
                      "completion_tokens_details": {"reasoning_tokens": 2},
                  },
              })

          client = instructor.from_openai(openai.OpenAI(
              api_key="test", http_client=httpx.Client(transport=httpx.MockTransport(respond))
          ))

          class SmokeAgent(AtomicAgent[SmokeInput, SmokeOutput]):
              pass

          assert SmokeTool().run(SmokeInput(text="tool input")).text == "tool input"
          agent = SmokeAgent(config=AgentConfig(client=client, model="offline-model"))
          with using_conversation("smoke-conversation"):
              assert agent.run(SmokeInput(text="private agent input")).text == "offline response"

          spans = exporter.get_finished_spans()
          for span in spans:
              print(f"{span.name}: {sorted(span.attributes)}")
          spans_by_operation = {span.attributes["gen_ai.operation.name"]: span for span in spans}
          assert len(spans) == 3
          assert len(spans_by_operation) == 3
          chat_span = spans_by_operation["chat"]
          tool_span = spans_by_operation["execute_tool"]
          agent_span = spans_by_operation["invoke_agent"]
          assert tool_span.name == f"execute_tool {SmokeTool().tool_name}"
          assert agent_span.name == "invoke_agent SmokeAgent"
          assert tool_span.attributes["gen_ai.tool.name"] == SmokeTool().tool_name
          assert tool_span.attributes["atomic_agents.tool.class"] == "SmokeTool"
          assert agent_span.attributes["atomic_agents.input"] == "__REDACTED__"
          assert agent_span.attributes["gen_ai.agent.name"] == "SmokeAgent"
          assert agent_span.attributes["atomic_agents.llm.attempts"] == 1
          assert chat_span.name == "chat offline-model"
          assert chat_span.parent.span_id == agent_span.context.span_id
          for span in (agent_span, chat_span):
              assert span.attributes["gen_ai.conversation.id"] == "smoke-conversation"
              assert span.attributes["gen_ai.request.model"] == "offline-model"
              assert span.attributes["gen_ai.response.model"] == "response-model"
              assert span.attributes["gen_ai.provider.name"] == "openai"
              assert span.attributes["gen_ai.usage.input_tokens"] == 3
              assert span.attributes["gen_ai.usage.output_tokens"] == 2
              assert span.attributes["gen_ai.usage.cache_read.input_tokens"] == 1
              assert span.attributes["gen_ai.usage.reasoning.output_tokens"] == 2
          forbidden_keys = {
              "input.value", "output.value", "input.mime_type", "output.mime_type",
              "agent.name", "tool.name", "tool.description", "tool.parameters", "session.id",
          }
          for span in spans:
              assert forbidden_keys.isdisjoint(span.attributes)
              assert not any(key.startswith("openinference.") for key in span.attributes)
          client.client.close()
          print("api-only tracing ok: tool, agent and chat spans, real Instructor usage, redacted input, no OpenInference keys")
          PY

      - name: Import every subpackage the way a new user would
        run: |
          fresh-install-venv/bin/python - <<'PY'
          import importlib
          import pkgutil

          import atomic_agents

          module_names = [module.name for module in pkgutil.walk_packages(atomic_agents.__path__, prefix="atomic_agents.")]
          failures = []
          for module_name in module_names:
              try:
                  importlib.import_module(module_name)
              except Exception as error:
                  failures.append(f"{module_name}: {type(error).__name__}: {error}")
          print(f"imported {len(module_names)} modules from {atomic_agents.__file__}")
          for failure in failures:
              print(failure)
          if failures:
              raise SystemExit(1)
          PY

  lowest-versions:
    name: Tests on the lowest allowed version of every direct dependency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Resolve runtime dependencies at their declared floors
        run: |
          echo 'opentelemetry-instrumentation==0.51b0' > telemetry-test-requirements.txt
          uv pip compile pyproject.toml telemetry-test-requirements.txt --resolution lowest-direct --extra observability --extra phoenix -o lowest-requirements.txt

      - name: Install the floors plus current test tooling
        run: |
          uv venv lowest-venv
          uv pip install --python lowest-venv -r lowest-requirements.txt pytest pytest-asyncio pytest-cov opentelemetry-instrumentation==0.51b0
          uv pip install --python lowest-venv --no-deps -e .

      - name: Show resolved versions
        run: lowest-venv/bin/python -c "import importlib.metadata as m; print(' '.join(p + '=' + m.version(p) for p in ['instructor', 'openai', 'pydantic', 'mcp', 'litellm']))"

      - name: Run Tests
        run: lowest-venv/bin/python -m pytest atomic-agents
